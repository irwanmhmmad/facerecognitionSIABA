[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "absen-face-service"
version = "0.1.0"
description = "Self-hosted biometric enrollment and 1:1 face verification service for ABSENMOBILE."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0",
  "fastapi>=0.115,<0.117",
  "httpx>=0.28,<0.29",
  "numpy>=2.0,<2.4",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "PyJWT>=2.9",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<0.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

