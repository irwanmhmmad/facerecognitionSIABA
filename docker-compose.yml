services:
  api:
    build:
      context: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://face_service:${POSTGRES_PASSWORD}@db:5432/face_service
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./models:/app/models:ro

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: face_service
      POSTGRES_USER: face_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face_service -d face_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - face_db:/var/lib/postgresql/data

volumes:
  face_db:

